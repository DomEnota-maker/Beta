name: Migrate VL80S equipment packs

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'qa/migrate_vl80s_equipment.py'
      - 'qa/validate_vl80s_equipment_migration.py'
      - '.github/workflows/vl80s-equipment-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        run: |
          git fetch origin modular-rebuild
          test "$(git rev-parse origin/modular-rebuild)" = "$GITHUB_SHA"

      - name: Export verified donor
        run: python3 qa/export_vl80s_donor.py

      - name: Generate modular equipment and technical-data packs
        run: python3 qa/migrate_vl80s_equipment.py

      - name: Validate generated migration
        run: |
          python3 qa/validate_vl80s_equipment_migration.py
          git diff --check

      - name: Commit generated VL80S packs
        run: |
          git add content-packs/electric/vl80s
          git diff --cached --check
          git config user.name "DomEnota-maker"
          git config user.email "dk3093706@gmail.com"
          git commit -m "feat: migrate VL80S equipment and technical data"

      - name: Push only if branch is still ours
        run: |
          git fetch origin modular-rebuild
          remote_head="$(git rev-parse origin/modular-rebuild)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "modular-rebuild moved to $remote_head; refusing non-fast-forward push."
            exit 1
          fi
          git push origin HEAD:modular-rebuild
