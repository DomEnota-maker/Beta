name: Migrate VL80S observation index

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'qa/export_vl80s_observation_donor.py'
      - 'qa/migrate_vl80s_observations.py'
      - 'qa/validate_vl80s_observations.py'
      - 'qa-tools/vl80s-observation-export/**'
      - '.github/workflows/vl80s-observation-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure branch has not moved
        run: |
          git fetch origin modular-rebuild
          test "$(git rev-parse origin/modular-rebuild)" = "$GITHUB_SHA"

      - name: Export pinned observation donor sources
        run: python3 qa/export_vl80s_observation_donor.py

      - name: Export donor observation catalog
        run: gradle :qa-vl80s-observation-export:run --stacktrace --console=plain

      - name: Generate canonical observation index
        run: python3 qa/migrate_vl80s_observations.py

      - name: Validate observation index
        run: |
          python3 qa/validate_vl80s_observations.py
          gradle :feature-diagnostics:test --stacktrace --console=plain
          git diff --check

      - name: Commit generated observation index
        run: |
          git add             content-packs/electric/vl80s/diagnostics/observations/index.json             content-packs/electric/vl80s/diagnostics/index.json             content-packs/electric/vl80s/migration/observations-report.json
          git diff --cached --check
          git config user.name "DomEnota-maker"
          git config user.email "dk3093706@gmail.com"
          if git diff --cached --quiet; then
            echo "Generated VL80S observation index is already up to date."
          else
            git commit -m "feat: migrate VL80S diagnostic observation index"
          fi

      - name: Push only if branch is still ours
        run: |
          git fetch origin modular-rebuild
          remote_head="$(git rev-parse origin/modular-rebuild)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "modular-rebuild moved to $remote_head; refusing non-fast-forward push."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "No generated commit to push."
          else
            git push origin HEAD:modular-rebuild
          fi
