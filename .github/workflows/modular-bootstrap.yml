name: Modular architecture bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'app-shell/**'
      - 'assistant-core/**'
      - 'design-system/**'
      - 'domain-contracts/**'
      - 'content-runtime/**'
      - 'navigation-contracts/**'
      - 'link-router/**'
      - 'source-policy/**'
      - 'content-schema/**'
      - 'content-packs/**'
      - 'qa/**'
      - '.github/workflows/modular-bootstrap.yml'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'app-shell/**'
      - 'assistant-core/**'
      - 'design-system/**'
      - 'domain-contracts/**'
      - 'content-runtime/**'
      - 'navigation-contracts/**'
      - 'link-router/**'
      - 'source-policy/**'
      - 'content-schema/**'
      - 'content-packs/**'
      - 'qa/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate modular content topology
        run: python3 qa/validate_content_topology.py

      - name: Validate pinned candidate inventory
        run: python3 qa/validate_vl80s_candidate_inventory.py

      - name: Show project boundaries
        run: gradle projects --console=plain

      - name: Contract, runtime, assistant, UI routing and policy tests
        run: >-
          gradle
          :assistant-core:test
          :domain-contracts:test
          :content-runtime:test
          :navigation-contracts:test
          :link-router:test
          :source-policy:test
          :design-system:testDebugUnitTest
          --stacktrace --console=plain

      - name: Android lint
        run: gradle :design-system:lintDebug :app-shell:lintDebug --stacktrace --console=plain

      - name: Assemble debug
        run: gradle :design-system:assembleDebug :app-shell:assembleDebug --stacktrace --console=plain
