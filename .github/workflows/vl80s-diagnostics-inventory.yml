name: Inventory VL80S diagnostics donor

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'qa/inventory_vl80s_diagnostics.py'
      - 'qa/validate_vl80s_diagnostics_inventory.py'
      - '.github/workflows/vl80s-diagnostics-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        run: |
          git fetch origin modular-rebuild
          test "$(git rev-parse origin/modular-rebuild)" = "$GITHUB_SHA"

      - name: Export verified donor
        run: python3 qa/export_vl80s_donor.py

      - name: Inventory diagnostic donor
        run: python3 qa/inventory_vl80s_diagnostics.py

      - name: Validate inventory
        run: |
          python3 qa/validate_vl80s_diagnostics_inventory.py
          git diff --check

      - name: Commit inventory report
        run: |
          git add content-packs/electric/vl80s/migration/diagnostics-inventory.json
          git diff --cached --check
          git config user.name "DomEnota-maker"
          git config user.email "dk3093706@gmail.com"
          git commit -m "chore: inventory VL80S diagnostics donor"

      - name: Push only if branch is still ours
        run: |
          git fetch origin modular-rebuild
          remote_head="$(git rev-parse origin/modular-rebuild)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "modular-rebuild moved to $remote_head; refusing non-fast-forward push."
            exit 1
          fi
          git push origin HEAD:modular-rebuild
