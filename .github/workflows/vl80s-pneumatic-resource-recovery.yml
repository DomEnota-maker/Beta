name: Recover VL80S pneumatic scheme resource

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'qa/recover_vl80s_pneumatic_resource.py'
      - '.github/workflows/vl80s-pneumatic-resource-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify pinned archive blob and extract source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="a3c93873bd128d4769d004098981235c169fd085"
          EXPECTED="6c3c7edc1713c1c901a566fd8a81a2494ee4ac58"
          ACTUAL="$(git rev-parse "$COMMIT:RailBrakeCalculator.zip")"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p build
          git show "$COMMIT:RailBrakeCalculator.zip" > build/vl80s-pneumatic-legacy.zip

      - name: Recover only pinned VL80S pneumatic JPEG
        run: python3 qa/recover_vl80s_pneumatic_resource.py build/vl80s-pneumatic-legacy.zip

      - name: Validate the recovered underlay and routes
        run: python3 qa/validate_vl80s_pneumatic_flows.py

      - name: Validate common Atlas loaders and contracts
        run: gradle :feature-atlas:testDebugUnitTest --stacktrace --console=plain

      - name: Commit canonical source asset with optimistic branch lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-packs/electric/vl80s/atlas/interactive/pneumatic-flows.json
          git add content-packs/electric/vl80s/atlas/interactive/pneumatic-scheme.jpg
          if git diff --cached --quiet; then
            echo "Pneumatic asset already matches the pinned source."
            exit 0
          fi
          git fetch origin modular-rebuild
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/modular-rebuild)" || {
            echo "Branch advanced; refusing stale generated write."
            exit 1
          }
          git commit -m "feat: recover verified VL80S pneumatic scheme underlay"
          git push origin HEAD:modular-rebuild
